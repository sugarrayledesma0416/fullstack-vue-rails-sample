config_version = "0"

exclude_patterns = [
  "!**/jquery.*.vhl.js",
  "!**/jquery.vhl*.js",
  "**/*.d.ts",
  "**/*.min.js",
  "**/.yarn/**",
  "**/Godeps/**",
  "**/angular-*.js",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/fine_uploader/*.js",
  "**/generated/**",
  "**/gradlew/**",
  "**/jquery-*.js",
  "**/jquery.*.js",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "*-min.*",
  "*.min.*",
  "*_min.*",
  "JavaScriptFlashGateway.js",
  "angular.js",
  "app/javascript/spec/",
  "app/lib/patches/capybara_selenium_driver.rb",
  "bin/",
  "config/",
  "db/",
  "features/",
  "jquery.js",
  "jwerty.js",
  "lib/demo_data/*",
  "lib/live_data/*",
  "lib/tasks/*.rake",
  "public/",
  "script/",
  "sha256.js",
  "spec/",
  "swfobject.js",
  "textAngular.js",
  "tmp/",
  "toastr.js",
]

test_patterns = [
  "**/*.spec.*",
  "**/*.test.*",
  "**/*.vitest.js",
  "**/*_spec.*",
  "**/*_test.*",
  "**/spec/**",
  "**/spec_*.*",
  "**/test/**",
  "**/test_*.*",
]

[smells]
mode = "comment"

[smells.boolean_logic]
threshold = 4

[smells.file_complexity]
threshold = 55

[smells.return_statements]
threshold = 4

[smells.nested_control_flow]
threshold = 4

[smells.function_parameters]
threshold = 4

[smells.function_complexity]
threshold = 5

[smells.duplication]
threshold = 22

[[source]]
name = "default"
default = true

[[plugin]]
name = "eslint"
version = "9.18.0"
package_file = "package.json"
package_filters = [
  "jest",
  "eslint",
  "globals",
  "eslint-plugin-vue",
  "@eslint/js",
  "@eslint/eslintrc",
  "eslint-plugin-jsdoc"
]

[[plugin]]
name = "rubocop"
version = "1.77.0"
package_file = "Gemfile"
package_filters = ["rubocop"]
