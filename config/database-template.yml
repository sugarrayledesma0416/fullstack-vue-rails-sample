development: &DEV
  adapter: mysql2
  encoding: utf8
  reconnect: false
  database: m3_development
  pool: 50
  username: root
  password:
  host: localhost

test:
  <<: *DEV
  database: m3_test<%= ENV['TEST_ENV_NUMBER'] %>

gradebook: &GRADEBOOK
  host: 'localhost'
  username: 'postgres'
  password: 'password'
  port: 5432
  adapter: 'postgresql'
  encoding: 'utf8'

gradebook_development:
  <<: *GRADEBOOK
  database: 'gradebook_development'

gradebook_test:
  <<: *GRADEBOOK
  database: 'gradebook_test'
